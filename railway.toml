[build]
  builder = "NIXPACKS"
  buildCommand = "npm install && npm run build"

[deploy]
  startCommand = "npm start"
  healthcheckPath = "/api/health"
  healthcheckTimeout = 30
  restartPolicyType = "ON_FAILURE"
  restartPolicyMaxRetries = 3

[environments.production.variables]
  PORT = "8787"
  NODE_ENV = "production"
  AI_ENGINE = "claude"
  OCR_ENABLED = "true"
  OCR_PREPROCESS = "true"
  TTS_ENGINE = "edge"
  SQLITE_ENABLED = "true"